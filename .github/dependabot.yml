# Weekly version updates, as ADR 0001 decides. Each subsystem adds its
# ecosystem here when its manifest lands; npm entries must use the
# packagefeedproxy.microsoft.io registry proxy, while Cargo uses crates.io
# directly. Commit prefixes follow the repository's conventional commit
# scopes.
version: 2

registries:
  npm-proxy:
    type: npm-registry
    url: https://packagefeedproxy.microsoft.io/npm/
    replaces-base: true

updates:
  # Actions in .github/workflows/, pinned to full commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Features in .devcontainer/devcontainer.json and their lockfile digests.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(devcontainer)

  # The digest-pinned base image in .devcontainer/Dockerfile.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: build(devcontainer)

  # Pinned repository tooling in tools/package.json and tools/package-lock.json.
  - package-ecosystem: npm
    directory: /tools
    registries:
      - npm-proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: build(tools)

  # The service's Cargo workspace in service/Cargo.toml and service/Cargo.lock.
  - package-ecosystem: cargo
    directory: /service
    schedule:
      interval: weekly
    commit-message:
      prefix: build(service)

  # The webapp's dependencies in webapp/package.json and webapp/package-lock.json.
  - package-ecosystem: npm
    directory: /webapp
    registries:
      - npm-proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: build(webapp)
    ignore:
      # ADR 0003 holds TypeScript at 6.0 until openapi-typescript runs on 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
