# Runs the repository validation gate, tools/check, inside the development
# container, as ADR 0001 decides. Branch protection requires only the
# "CI result" job, so add every new job to its needs list.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks. Runs on main
# are never cancelled, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: tools/check
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tools/check in the development container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: tools/check

  result:
    name: CI result
    if: always()
    needs:
      - check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$failed" ]]; then
            echo "::error::Required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "Every required job succeeded."
